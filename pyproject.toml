[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "vamc"
dynamic = ["version"]
description = "Verified adaptive modernization for legacy scientific Fortran"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Yash Misra" }]
maintainers = [{ name = "Yash Misra" }]
keywords = ["fortran", "modernization", "scientific-computing", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "psyclone>=3.3.1,<4",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "hypothesis>=6.140,<7",
]
security = [
  "bandit>=1.8.6,<2",
  "check-wheel-contents>=0.6.1,<1",
  "pip-audit>=2.9,<3",
  "twine>=6.2,<7",
]
optimize = [
  "numpy>=2.4,<2.5",
  "numba>=0.66,<0.67",
]

[project.urls]
Homepage = "https://github.com/YashM1503/vamc"
Repository = "https://github.com/YashM1503/vamc"
Issues = "https://github.com/YashM1503/vamc/issues"
Documentation = "https://github.com/YashM1503/vamc/tree/main/docs"
Changelog = "https://github.com/YashM1503/vamc/blob/main/CHANGELOG.md"

[project.scripts]
vamc = "vamc.cli:main"
vamc-mcp = "vamc.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vamc = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "vamc._version.__version__" }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore::pyparsing.warnings.PyparsingDeprecationWarning:psyclone.expression",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "S", "UP"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.coverage.run]
omit = [
  "src/vamc/verify/benchmark_runner.py",
  "src/vamc/verify/sandbox_runner.py",
]
