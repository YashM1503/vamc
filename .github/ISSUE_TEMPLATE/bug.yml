name: Bug report
description: Report a reproducible VAMC defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not disclose vulnerabilities here; follow SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected behavior and the actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Remove proprietary code and secrets before posting.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VAMC version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python and operating system
    validations:
      required: true
