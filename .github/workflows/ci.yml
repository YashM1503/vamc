name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,security,optimize]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=vamc --cov-report=term-missing --cov-fail-under=85
      - run: python -m build
      - run: check-wheel-contents dist/*.whl
      - run: twine check dist/*
      - run: python -m pip check
      - name: Smoke-test built wheel outside the source tree
        run: |
          python -m venv /tmp/vamc-smoke
          /tmp/vamc-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/vamc-smoke/bin/vamc --version
